name: auto-news-to-instagram
on:
  schedule:
    - cron: "0 23 * * *"   # 매일 한국시간 08:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum
      - run: pip install feedparser requests pillow anthropic

      - name: 카드뉴스 생성
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python generate.py build
          if [ -f pending.txt ]; then
            echo "pid=$(cat pending.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: 결과물 커밋 (인스타가 읽을 공개 URL 확보)
        if: steps.gen.outputs.pid != ''
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add out posted.json
          git commit -m "news ${{ steps.gen.outputs.pid }}"
          git push

      - name: 인스타그램 자동 업로드
        if: steps.gen.outputs.pid != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publish.py "${{ steps.gen.outputs.pid }}"
